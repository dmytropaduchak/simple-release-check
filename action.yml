name: Simple Release Check
description: Warn when release hygiene is missing (changelog, SBOM, provenance in release workflows).
author: Dmytro Paduchak
branding:
  icon: tag
  color: gray-dark
inputs:
  github-token:
    description: Token to post sticky PR comments.
    required: false
    default: ${{ github.token }}
  fail-on:
    description: "none = report only; medium or high = fail when findings match."
    required: false
    default: none
runs:
  using: node20
  main: dist/index.js
